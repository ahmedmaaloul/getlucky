name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` rather than `install`, so a lockfile that has drifted fails here
      # instead of silently resolving to different versions than anyone tested.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      # Every test is pure — no network — so CI cannot go red because a job
      # board happened to be down.
      - run: npm test

      - run: npm run build

      # The published MCP server must keep building and still answer --version.
      - run: npm run build:mcp
      - run: node mcp/dist/index.mjs --version

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
