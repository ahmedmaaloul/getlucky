name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci` rather than `install`, so a lockfile that has drifted fails here
      # instead of silently resolving to different versions than anyone tested.
      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck

      # Every test is pure — no network — so CI cannot go red because a job
      # board happened to be down.
      - run: npm test

      - run: npm run build

      - run: npm run build:mcp

      # Pack and install the MCP server somewhere with none of this repo's
      # node_modules, then run it. Executing the bundle in place cannot catch a
      # missing dependency, because every dependency is already installed here —
      # which is how a build that bare-imported Playwright passed a smoke test
      # and would still have been broken for every `npx getlucky-mcp` user.
      - name: Verify the published package works in isolation
        run: |
          set -euo pipefail
          tarball="$(cd mcp && npm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          mkdir -p "$RUNNER_TEMP/pkgtest"
          cd "$RUNNER_TEMP/pkgtest"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP/$tarball"
          ./node_modules/.bin/getlucky-mcp --version

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
